[project]
name = "hand2sim"
version = "0.1.0"
description = "Human hand video -> robot trajectory -> reproducible MuJoCo evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "mujoco==3.3.0",
  "gymnasium-robotics==1.4.2",
  "imageio",
]

[project.optional-dependencies]
video = ["mediapipe>=0.10.20", "opencv-python"]
dev = ["pytest"]

[tool.setuptools]
packages = ["hand2sim"]

[tool.pytest.ini_options]
pythonpath = ["."]
